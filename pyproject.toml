[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "basic-csv-writer"
version = "0.1.0"
description = "A tiny, safe CSV writer for flat key/value dicts (with CSV/formula-injection protection)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Michael Smolkin", email = "michael@smolkin.org" }]
keywords = ["csv", "dictwriter", "csv-injection", "formula-injection", "security", "stdlib"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
basic-csv-writer = "basic_csv_writer.__main__:main"

[project.urls]
Homepage = "https://github.com/smolkapps/basic-csv-writer"
Repository = "https://github.com/smolkapps/basic-csv-writer"
Issues = "https://github.com/smolkapps/basic-csv-writer/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/basic_csv_writer"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
